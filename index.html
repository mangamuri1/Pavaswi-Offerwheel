<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spin Wheel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #FFF8E7 0%, #F5E6D3 100%); /* Premium warm jewellery theme background */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
  }
  .top-images {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  .top-logo {
    height: 150px;
    width: 150px;
    object-fit: contain;
    border-radius: 50%;
    border: 4px solid #8B0000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    background: #fff;
    transition: all 0.3s ease;
  }
  .top-owner {
    height: 150px;
    width: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #8B0000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }
  @media (max-width: 480px) {
    .top-logo, .top-owner { height: 75px; width: 75px; border-width: 2px; }
    .top-images { margin-bottom: 0.5rem; }
    .container { padding: 0.5rem 0.8rem; }
    .main-title { margin-bottom: 0.5rem; font-size: 18px; }
    .wheel-wrap { margin-bottom: 0.2rem; transform: scale(0.85); margin-top: -15px; }
    .spin-btn { margin-bottom: 0.5rem; padding: 10px 30px; }
    .result-box { margin-bottom: 0.5rem; min-height: 50px; padding: 10px; font-size: 13px; }
    .legend { margin-top: 0.5rem; gap: 4px; }
    .legend-item { padding: 6px 8px; }
  }
  .container { padding: 0 0.8rem 1.2rem; max-width: 420px; margin: 0 auto; text-align: center; }
  .shop-title { font-size: 12px; color: var(--color-text-secondary); letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px; }
  .main-title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1.2rem; }
  .wheel-wrap { position: relative; width: 290px; height: 290px; margin: 0 auto 1.2rem; }
  .pointer { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 0; height: 0;
    border-left: 13px solid transparent; border-right: 13px solid transparent;
    border-top: 30px solid #8B0000; z-index: 10; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25)); }
  .spin-btn { background: #8B0000; color: #fff; border: none; border-radius: 50px;
    padding: 13px 44px; font-size: 16px; font-weight: 500; cursor: pointer; margin-bottom: 1rem;
    transition: opacity 0.2s, transform 0.1s; width: 100%; max-width: 260px; }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .result-box { min-height: 68px; background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg);
    padding: 14px 16px; font-size: 14px; color: var(--color-text-primary);
    margin: 0 auto 0.8rem; max-width: 300px; line-height: 1.6; }
  .prize-label { font-weight: 500; font-size: 16px; color: #8B0000; display: block; margin-top: 4px; }
  .reset-btn { 
    background: #FFD700; 
    border: 2px solid #FFA500;
    border-radius: var(--border-radius-md); 
    padding: 10px 24px; 
    font-size: 14px;
    font-weight: bold;
    color: #8B0000; 
    cursor: pointer; 
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
    50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 215, 0, 0.8); }
    100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
  }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 1.2rem; }
  .legend-item { display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md);
    padding: 8px 10px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-text { font-size: 12px; color: var(--color-text-primary); font-weight: 400; line-height: 1.3; }
</style>
</head>
<body>

<div class="container">
  <div class="top-images">
    <img src="Owner Photo.png" alt="Owner" class="top-owner">
    <img src="Logo.jpeg" alt="Logo" class="top-logo">
  </div>
  <p class="shop-title">Pavaswi Jewellary</p>
  <p class="main-title">Spin &amp; Win!</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="290" height="290"></canvas>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spinWheel()">🎯 Spin the Wheel</button>
  <div class="result-box" id="resultBox">Spin the wheel to reveal your special offer!</div>
  <button class="reset-btn" id="resetBtn" style="display:none" onclick="resetWheel()">↺ &nbsp;Spin Again (New Customer)</button>

  <div class="legend" id="legend"></div>
</div>

<script>
const offers = [
  { label: "₹50",    line2: "OFF",               full: "₹50 Off on this purchase!",                      color: "#1565C0", text: "#fff" },
  { label: "Better", line2: "Luck",               full: "Better Luck Next Time 😔",                       color: "#757575", text: "#fff" },
  { label: "₹200",   line2: "Voucher*",           full: "₹200 Voucher* (next purchase)", color: "#8B0000", text: "#fff" },
  { label: "Free",   line2: "Earrings ₹99",       full: "Free Earrings worth ₹99 — yours today! 🎁",      color: "#6A1E8A", text: "#fff" },
  { label: "₹100",   line2: "OFF",               full: "₹100 Off on this purchase!",                     color: "#1B6B3A", text: "#fff" },
  { label: "Better", line2: "Luck",               full: "Better Luck Next Time 😔",                       color: "#757575", text: "#fff" },
  { label: "₹50",    line2: "OFF",               full: "₹50 Off on this purchase!",                      color: "#1565C0", text: "#fff" },
  { label: "₹100",   line2: "OFF",               full: "₹100 Off on this purchase!",                     color: "#1B6B3A", text: "#fff" },
];

const legendItems = [
  { color: "#1565C0", text: "₹50 Off (today)" },
  { color: "#1B6B3A", text: "₹100 Off (today)" },
  { color: "#8B0000", text: "₹200 Voucher* (next purchase)" },
  { color: "#6A1E8A", text: "Free Earrings ₹99" },
  { color: "#757575", text: "Better Luck Next Time" },
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const n = offers.length;
const arc = (2 * Math.PI) / n;
let angle = 0, spinning = false, spun = false;

// Audio Context for spinning sound
let audioCtx;
function playTick() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(600, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.05);
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.05);
}

function playWin() {
  if (!audioCtx) return;
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const osc3 = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc1.type = 'sine'; osc2.type = 'sine'; osc3.type = 'sine';
  osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
  osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
  osc3.frequency.setValueAtTime(783.99, audioCtx.currentTime); // G5
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
  gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
  osc1.connect(gainNode); osc2.connect(gainNode); osc3.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc1.start(); osc2.start(); osc3.start();
  osc1.stop(audioCtx.currentTime + 1.5); osc2.stop(audioCtx.currentTime + 1.5); osc3.stop(audioCtx.currentTime + 1.5);
}

function playLose() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 1);
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 1);
}

function drawWheel(a) {
  ctx.clearRect(0, 0, 290, 290);
  const cx = 145, cy = 145, r = 138;
  for (let i = 0; i < n; i++) {
    const s = a + i * arc, e = s + arc;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, s, e); ctx.closePath();
    ctx.fillStyle = offers[i].color; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s + arc / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "600 12px sans-serif";
    ctx.fillText(offers[i].label, r - 10, -3);
    ctx.font = "400 10px sans-serif";
    ctx.fillText(offers[i].line2, r - 10, 10);
    ctx.restore();
  }
  // outer ring
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
  // center
  ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 2*Math.PI);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "#8B0000"; ctx.font = "600 10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("SPIN", cx, cy + 4);
}

function spinWheel() {
  if (spinning || spun) return;
  
  // Initialize audio context on first user interaction
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("resultBox").innerHTML = "🌀 Spinning...";
  const total = (5 + Math.floor(Math.random() * 5)) * 2 * Math.PI + Math.random() * 2 * Math.PI;
  const dur = 4500, t0 = performance.now(), a0 = angle;
  let lastSlice = Math.floor(angle / arc);

  function animate(now) {
    const t = Math.min((now - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - t, 4);
    angle = a0 + total * ease;
    
    // Play tick sound when passing a slice
    let currentSlice = Math.floor(angle / arc);
    if (currentSlice !== lastSlice) {
      playTick();
      lastSlice = currentSlice;
    }

    drawWheel(angle);
    if (t < 1) { requestAnimationFrame(animate); }
    else { spinning = false; spun = true; showResult(); document.getElementById("resetBtn").style.display = "inline-block"; }
  }
  requestAnimationFrame(animate);
}

function showResult() {
  const norm = ((angle % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  const rel = ((3*Math.PI/2) - norm + 2*Math.PI) % (2*Math.PI);
  const idx = Math.floor(rel / arc) % n;
  const p = offers[idx];
  const isBad = p.label === "Better";
  const isVoucher = p.line2 === "Voucher*";
  
  if (isBad) { playLose(); } else { playWin(); }

  let html = isBad
    ? `😔 <span class="prize-label" style="color:#757575">${p.full}</span>`
    : `🎉 You won!<span class="prize-label">${p.full}</span>`;
  if (isVoucher) html += `<div style="font-size:11px;color:var(--color-text-secondary);margin-top:6px;">*Voucher applicable on your next visit. Valid for 30 days.</div>`;
  document.getElementById("resultBox").innerHTML = html;
}

function resetWheel() {
  spun = false;
  document.getElementById("spinBtn").disabled = false;
  document.getElementById("resetBtn").style.display = "none";
  document.getElementById("resultBox").innerHTML = "Spin the wheel to reveal your special offer!";
}

// Legend
const lg = document.getElementById("legend");
legendItems.forEach(item => {
  lg.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${item.color}"></div><span class="legend-text">${item.text}</span></div>`;
});

drawWheel(0);
</script>
</body>
</html>
